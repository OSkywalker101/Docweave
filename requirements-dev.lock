# Known-good versions, recorded so CI and local runs agree.
#
# This is NOT a lockfile: the pyproject ranges stay permissive for library
# consumers, and this file is what the project's own automation installs. A
# dependency releasing a breaking change should be an explicit decision here
# rather than a surprise red build on someone else's PR.
#
# Regenerate with:
#     python -m pip freeze > requirements-dev.lock
# then review the diff. A large jump in this file is a change worth reading.

